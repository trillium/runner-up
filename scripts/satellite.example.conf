# shellcheck shell=bash
# shellcheck disable=SC2034
#
# Example per-machine config for scripts/launch-satellite.sh.
#
# Copy this file to scripts/satellite.local.conf (ignored by git), replace the
# placeholder names, then run:
#
#   scripts/launch-satellite.sh --dry-run
#   scripts/launch-satellite.sh
#
# Credentials never go here. Put them in scripts/satellite.local.env (also
# ignored by git) or type them when the script asks. See
# docs/satellite-launch.md for every setting and its default.

# The machine's hostname and the account the steps run as. The username is
# also used to replace the dotfiles' hardcoded user below.
SATELLITE_HOSTNAME="satellite-1"
SATELLITE_USERNAME="satellite"

# The name this machine gets on the tailnet.
SATELLITE_TAILNET_NAME="satellite-1"

# Optional: a local untracked file with credentials such as GH_TOKEN or
# ANTHROPIC_API_KEY. It is sourced, never printed. Default:
# SATELLITE_ENV_FILE="$HOME/.local/share/satellite-launch/satellite.local.env"
SATELLITE_ENV_FILE="$SATELLITE_CONFIG_DIR/satellite.local.env"

# Dotfiles. Leave SATELLITE_DOTFILES_REPO empty to skip this step.
SATELLITE_DOTFILES_REPO="https://github.com/example/dotfiles.git"
SATELLITE_DOTFILES_REF="main"
SATELLITE_DOTFILES_DIR="$HOME/.local/share/satellite-launch/dotfiles"
SATELLITE_DOTFILES_INSTALL="install.sh"
SATELLITE_DOTFILES_INSTALL_ARGS=()
# The dotfiles hardcode this account; the script replaces it with
# SATELLITE_USERNAME in the clone before running the installer. Set it empty
# to leave the files untouched.
SATELLITE_DOTFILES_HARDCODED_USERNAME="trilliumsmith"
SATELLITE_DOTFILES_NEEDS_SUDO=0
# Set 1 when the dotfiles repository is private and git will ask for credentials.
SATELLITE_DOTFILES_NEEDS_AUTH=0

# Tools to install. Known: claude, pi, gh, tailscale, tart.
SATELLITE_TOOLS=(claude pi gh tailscale tart)
# How to install tailscale when it is missing: cask (the app, default) or
# formula (the open-source daemon).
SATELLITE_TAILSCALE_INSTALL="cask"

# Accounts to sign in to. Known: github, tailscale, claude, pi.
SATELLITE_ACCOUNTS=(github tailscale claude pi)

# Firstmate home and fleet. The script creates the fleet's state, config,
# bin, data and .agents folders. SATELLITE_FIRSTMATE_REPO and
# SATELLITE_FIRSTMATE_INSTALL are optional; leave them empty to create only
# the folders.
SATELLITE_FIRSTMATE_HOME="$HOME/fm_home"
SATELLITE_FIRSTMATE_FLEET="example-ops"
SATELLITE_FIRSTMATE_REPO=""
SATELLITE_FIRSTMATE_REF="main"
SATELLITE_FIRSTMATE_INSTALL=""
SATELLITE_FIRSTMATE_NEEDS_AUTH=0

# runner-up. machine add runs on the coordinator, not here. Modes:
#   auto  - print when a coordinator is named, otherwise run locally
#   off   - do nothing
#   print - print the exact command for the coordinator
#   local - run runner-up machine add on this machine (this is the coordinator)
#   ssh   - run it on SATELLITE_RUNNER_UP_COORDINATOR over SSH, after asking
SATELLITE_RUNNER_UP_MODE="auto"
SATELLITE_RUNNER_UP_COORDINATOR="coordinator.example"
SATELLITE_RUNNER_UP_MACHINE="satellite-1"
# The destination the coordinator uses to reach this machine.
SATELLITE_RUNNER_UP_SSH="ci@satellite-1"
SATELLITE_RUNNER_UP_PROVIDER="tart"
SATELLITE_RUNNER_UP_IMAGE="ghcr.io/cirruslabs/macos-sequoia-base:latest"
SATELLITE_RUNNER_UP_POOLS=("mac-satellite")
SATELLITE_RUNNER_UP_PLACES=0
SATELLITE_RUNNER_UP_PLACE_CORES=0
SATELLITE_RUNNER_UP_PLACE_MEMORY=0
